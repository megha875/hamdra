<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Hamdard Store - Header</title>

  <!-- Bootstrap 5 + Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --hamdard-red: #e30613;
      --hamdard-dark: #1a1a1a;
    }
    body { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; color: var(--hamdard-dark); }

    /* Equal left/right spacing for all sections */
    .page-wrap { width: 100%; max-width: 1320px; margin-left: auto; margin-right: auto; padding-left: 24px; padding-right: 24px; }

    /* Top red strip */
    .top-strip { background: var(--hamdard-red); color: #fff; font-size: 11px; padding: 7px 0; }
    .top-strip i { margin-right: 6px; }
    .top-strip .row { margin-left: 0; margin-right: 0; }

    /* Main header */
    .main-header { background: #fff; padding: 14px 0; border-top: 1px solid #4a6cf7; border-bottom: 1px solid #4a6cf7; }
    .brand-text { font-weight: 800; font-size: 20px; line-height: 1; color: var(--hamdard-dark); text-decoration: none; }
    .brand-text span { color: var(--hamdard-red); }
    .brand-text small { display: block; font-size: 18px; font-weight: 700; }

    .search-box { border: 1px solid #d9d9d9; border-radius: 50px; padding: 4px 4px 4px 14px; background: #fff; }
    .search-box input { border: 0; box-shadow: none; font-size: 12px; background: transparent; }
    .search-box input:focus { box-shadow: none; outline: 0; }
    .btn-search { background: var(--hamdard-red); color: #fff; border-radius: 50px; padding: 6px 22px; font-size: 12px; font-weight: 600; border: 0; }
    .btn-search:hover { background: #b9050f; color: #fff; }

    .deliver small { display: block; font-size: 9px; color: #888; line-height: 1; }
    .deliver strong { font-size: 12px; font-weight: 600; }
    .header-link { color: var(--hamdard-dark); text-decoration: none; font-size: 12px; font-weight: 600; }
    .header-link:hover { color: var(--hamdard-red); }

    .logo-box img { height: 48px; width: auto; max-width: 100%; display: block; }
    .brand-text img { height: 48px; width: auto; max-width: 100%; display: block; }

    /* Category / nav row */
    .nav-row { background: #fff; border-top: 1px solid #4a6cf7; border-bottom: 1px solid #4a6cf7; padding: 10px 0; }
    .nav-row .nav-link-item { color: var(--hamdard-dark); text-decoration: none; font-size: 12px; font-weight: 500; padding: 4px 8px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; position: relative; }
    .nav-row .nav-link-item:hover { color: var(--hamdard-red); }
    .nav-row .nav-link-item.active { background: #dbe4ff; outline: 1px solid #4a6cf7; }
    .btn-categories { background: var(--hamdard-red); color: #fff; font-size: 12px; font-weight: 600; border-radius: 4px; padding: 7px 14px; border: 0; }
    .btn-categories:hover { background: #b9050f; color: #fff; }
    .offer-badge { position: absolute; top: -9px; left: 8px; background: var(--hamdard-red); color: #fff; font-size: 7px; padding: 1px 5px; border-radius: 8px; line-height: 1.3; }
    .btn-track { background: var(--hamdard-red); color: #fff; font-size: 12px; font-weight: 600; border-radius: 4px; padding: 7px 16px; border: 0; }
    .btn-track:hover { background: #b9050f; color: #fff; }

    @media (max-width: 991px) {
      .nav-scroll { overflow-x: auto; flex-wrap: nowrap !important; }
    }
  </style>
</head>
<body>

  <!-- TOP STRIP -->
  <div class="top-strip">
    <div class="page-wrap">
      <div class="row text-center g-2">
        <div class="col-6 col-md-3"><i class="bi bi-truck"></i>Free Shipping for orders above ₹499 across India</div>
        <div class="col-6 col-md-3"><i class="bi bi-gift"></i>Free Hamdard Khasta Biryani Masala 10g with every order</div>
        <div class="col-6 col-md-3"><i class="bi bi-patch-check"></i>Authentic Hamdard Products</div>
        <div class="col-6 col-md-3">Trusted Since 1906</div>
      </div>
    </div>
  </div>

  <!-- MAIN HEADER -->
  <header class="main-header">
    <div class="page-wrap">
      <div class="row align-items-center g-3">

        <!-- Logo -->
        <div class="col-6 col-lg-2">
          <a href="#" class="brand-text">
          <img src="./assets/img/7ffc80199d8f6e92ee69c98c4fc4ca1739e7fc83.png"/>
          </a>
        </div>

        <!-- Search -->
        <div class="col-12 col-lg-5 order-3 order-lg-2">
          <div class="search-box d-flex align-items-center">
            <i class="bi bi-search text-secondary me-2"></i>
            <input type="text" class="form-control" placeholder="Search for products, categories or brands...">
            <button class="btn-search">Search</button>
          </div>
        </div>

        <!-- Right side -->
        <div class="col-6 col-lg-5 order-2 order-lg-3">
          <div class="d-flex align-items-center justify-content-end gap-4">
            <div class="deliver d-none d-md-flex align-items-center gap-1">
              <i class="bi bi-geo-alt fs-6"></i>
              <div>
                <small>Deliver to</small>
                <strong>Check your Pincode <i class="bi bi-chevron-down" style="font-size:9px"></i></strong>
              </div>
            </div>
            <a href="#" class="header-link"><i class="bi bi-person me-1 fs-6"></i>Account <i class="bi bi-chevron-down" style="font-size:9px"></i></a>
            <a href="#" class="header-link"><i class="bi bi-bag me-1 fs-6"></i>Cart</a>
            <div class="logo-box d-none d-md-block">
              <img src="hamdard-logo.png" alt="Hamdard - The Stood Since 1906">
            </div>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- NAV ROW -->
  <nav class="nav-row">
    <div class="page-wrap">
      <div class="d-flex align-items-center justify-content-between gap-3 nav-scroll">

        <div class="d-flex align-items-center justify-content-between flex-grow-1 nav-scroll">
          <button class="btn-categories">
            <i class="bi bi-grid-3x3-gap-fill me-1"></i>All Categories <i class="bi bi-chevron-down" style="font-size:9px"></i>
          </button>

          <a href="#" class="nav-link-item"><span class="offer-badge">Upto 40%</span><i class="bi bi-percent"></i>Offers</a>
          <a href="#" class="nav-link-item active"><i class="bi bi-cup-straw"></i>Beverages</a>
          <a href="#" class="nav-link-item"><i class="bi bi-flower1"></i>Spices</a>
          <a href="#" class="nav-link-item"><i class="bi bi-droplet"></i>Edible Oil</a>
          <a href="#" class="nav-link-item"><i class="bi bi-hexagon"></i>Honey</a>
          <a href="#" class="nav-link-item"><i class="bi bi-egg-fried"></i>Ready to cook</a>
          <a href="#" class="nav-link-item"><i class="bi bi-heart-pulse"></i>Health Care</a>
          <a href="#" class="nav-link-item"><i class="bi bi-box2-heart"></i>Combos</a>
          <a href="#" class="nav-link-item"><i class="bi bi-telephone"></i>Contact</a>
        </div>

        <button class="btn-track">Track Order</button>
      </div>
    </div>
  </nav>

</body>
</html>
