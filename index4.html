    /* Card Box Styling */

      border-radius: 16px;
      overflow: visible;
      margin-bottom: 25px;
      background: transparent;
    }

    .product-img-box {

      height: 190px;
      border-radius: 16px;
      overflow: hidden;
    }

    .product-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .product-card:hover .product-img-box img {
      transform: scale(1.04);
    }

    /* Overlay Info Box */
    .product-info-box {
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      background: #ffffff;
      border-radius: 12px;
      padding: 10px 8px 18px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);

    .product-title {

      font-weight: 700;
      color: #222222;
      margin: 0;
    }

    /* Red Action Button */

      color: #ffffff;

      padding: 4px 18px;
      white-space: nowrap;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(227, 30, 37, 0.3);
      transition: background-color 0.2s ease;
    }

    .btn-view-more:hover {
      background-color: #c9181e;
      color: #ffffff;
    }

    /* Fixed 5 Pagination Dots Container */
    .custom-dots-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }

    .custom-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #d1d1d1;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .custom-dot.active {
      background-color: #e31e25;
      width: 9px;
      height: 9px;
    }
  </style>

  <!-- Custom Dot Navigation JS Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const dots = document.querySelectorAll("#customDots .custom-dot");

      var swiper = new Swiper(".productRangeSwiper", {
        slidesPerView: 2,
        spaceBetween: 16,
        loop: true,
        speed: 700,
        autoplay: {
          delay: 1800,
          disableOnInteraction: false,
        },
        breakpoints: {
          576: { slidesPerView: 3, spaceBetween: 16 },
          768: { slidesPerView: 4, spaceBetween: 18 },
          992: { slidesPerView: 6, spaceBetween: 18 }
        },
        on: {
          slideChange: function () {
            // Calculate active index inside 0 to 4 range so red dot never disappears
            let activeIndex = this.realIndex % 5;
            dots.forEach((dot, idx) => {
              if (idx === activeIndex) {
                dot.classList.add("active");
              } else {
                dot.classList.remove("active");
              }
            });
          }
        }
      });

      // Click event for dots
      dots.forEach((dot, index) => {
        dot.addEventListener("click", function () {
          swiper.slideToLoop(index);
        });
      });
    });
  </script>
