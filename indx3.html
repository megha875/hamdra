<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamdard Header Replica</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Global Styles */
    :root {
      --primary-red: #e31e25;
      --bg-light-gray: #fbf9f9;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Outer Wrapper */
    .header-wrapper {
      width: 100%;
    }

    /* Common Padding for Exact Alignments */
    .top-announcement-bar .container-fluid,
    .main-header .container-fluid,
    .category-navbar .container-fluid {
      padding-left: 45px !important;
      padding-right: 45px !important;
    }

    /* 1. Top Announcement Bar */
    .top-announcement-bar {
      background-color: var(--primary-red);
      color: #ffffff;
    }

    .top-bar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      font-size: 11px;
      font-weight: 500;
    }

    .top-bar-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 1;
      text-align: center;
      white-space: nowrap;
      padding: 0 15px;
    }

    .top-bar-icon {
      font-size: 12px;
    }

    .top-bar-divider {
      width: 1px;
      height: 12px;
      background-color: rgba(255, 255, 255, 0.4);
    }

    /* 2. Main Header */
    .search-form {
      border: 1.5px solid #dfdfdf;
      background-color: #ffffff;
      max-width: 650px;
      width: 100%;
    }

    .search-form input::placeholder {
      color: #a0a0a0;
      font-size: 13px;
    }

    .vertical-divider {
      width: 1px;
      height: 24px;
      background-color: #e0e0e0;
    }

    /* 3. Category Nav Bar */
    .category-navbar {
      background-color: var(--bg-light-gray);
    }

    .category-item {
      color: #222222;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      padding: 4px 8px;
      white-space: nowrap;
    }

    .category-item:hover {
      color: var(--primary-red);
    }

    .cat-divider {
      width: 1px;
      height: 16px;
      background-color: #dcdcdc;
    }

    .offer-tag {
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 8px;
    }

    /* Mobile Responsive Reset */
    @media (max-width: 991.98px) {
      .top-announcement-bar .container-fluid,
      .main-header .container-fluid,
      .category-navbar .container-fluid {
        padding-left: 15px !important;
        padding-right: 15px !important;
      }
      .top-bar-inner {
        overflow-x: auto;
        justify-content: flex-start;
      }
      .top-bar-item {
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>

  <header class="header-wrapper d-flex flex-column">
    
    <!-- 1. TOP ANNOUNCEMENT BAR -->
    <div class="top-announcement-bar">
      <div class="container-fluid">
        <div class="top-bar-inner">
          
          <div class="top-bar-item">
            <i class="fa-solid fa-truck-fast top-bar-icon"></i>
            <span>Free Shipping for orders above ₹499 across India</span>
          </div>
          <div class="top-bar-divider"></div>

          <div class="top-bar-item">
            <i class="fa-solid fa-leaf top-bar-icon"></i>
            <span>Free Hamdard Khaalis Biryani Masala 10g with every order</span>
          </div>
          <div class="top-bar-divider"></div>

          <div class="top-bar-item">
            <i class="fa-solid fa-tag top-bar-icon"></i>
            <span>Authentic Hamdard Products</span>
          </div>
          <div class="top-bar-divider"></div>

          <div class="top-bar-item">
            <span>Trusted Since 1906</span>
          </div>

        </div>
      </div>
    </div>

    <!-- 2. MAIN HEADER SECTION -->
    <div class="main-header bg-white py-2 border-bottom">
      <div class="container-fluid">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
          
          <!-- Logo -->
          <div class="header-logo">
            <a href="#">
              <img src="logo.png" alt="MyHamdardStore.com" height="42">
            </a>
          </div>

          <!-- Search Bar Container -->
          <div class="search-box-wrapper flex-grow-1 mx-lg-4">
            <form class="search-form d-flex align-items-center rounded-pill px-3 py-1">
              <i class="fa-solid fa-magnifying-glass text-muted me-2 fs-5"></i>
              <input type="text" class="form-control border-0 shadow-none bg-transparent" placeholder="Search for products, categories or brands...">
              <div class="vertical-divider mx-2"></div>
              <button type="submit" class="btn btn-danger rounded-pill px-4 text-white font-14">Search</button>
            </form>
          </div>

          <!-- Right User Actions -->
          <div class="d-flex align-items-center gap-4">
            <!-- Pincode -->
            <div class="d-flex align-items-center">
              <i class="fa-solid fa-location-dot fs-5 text-dark me-2"></i>
              <div class="lh-1">
                <span class="d-block text-muted" style="font-size: 10px;">Hello</span>
                <a href="#" class="fw-bold text-dark text-decoration-none" style="font-size: 12px;">Check your Pincode <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i></a>
              </div>
            </div>

            <!-- Account -->
            <div class="d-flex align-items-center">
              <i class="fa-regular fa-user fs-5 text-dark me-2"></i>
              <a href="#" class="fw-bold text-dark text-decoration-none" style="font-size: 13px;">Account <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i></a>
            </div>

            <!-- Cart -->
            <div class="d-flex align-items-center position-relative">
              <div class="position-relative me-2">
                <i class="fa-solid fa-cart-shopping fs-5 text-dark"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-circle bg-danger" style="font-size: 10px;">0</span>
              </div>
              <span class="fw-bold text-dark ms-1" style="font-size: 13px;">Cart</span>
            </div>

            <div class="vertical-divider"></div>

            <!-- Brand Seal/Logo -->
            <div class="brand-seal">
              <img src="seal.png" alt="Hamdard Trusted Since 1906" height="48">
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- 3. CATEGORY NAVIGATION BAR -->
    <nav class="category-navbar py-2 border-bottom">
      <div class="container-fluid">
        <div class="d-flex align-items-center justify-content-between overflow-auto flex-nowrap">
          
          <!-- All Categories Button -->
          <button class="btn btn-danger text-white rounded-2 px-3 py-1 me-3 fw-semibold d-flex align-items-center text-nowrap" style="font-size: 13px;">
            <i class="fa-solid fa-grip me-2"></i> All Categories <i class="fa-solid fa-chevron-down ms-2" style="font-size: 10px;"></i>
          </button>

          <!-- Category Links -->
          <div class="d-flex align-items-center gap-1 flex-nowrap">
            
            <div class="position-relative px-2">
              <span class="badge bg-danger position-absolute offer-tag">Upto 30%</span>
              <a href="#" class="category-item"><i class="fa-solid fa-fire me-1 text-muted"></i> Offers</a>
            </div>
            <div class="cat-divider"></div>

            <a href="#" class="category-item"><i class="fa-solid fa-glass-water me-1 text-muted"></i> Beverages</a>
            <div class="cat-divider"></div>

            <a href="#" class="category-item"><i class="fa-solid fa-leaf me-1 text-muted"></i> Spices</a>
            <div class="cat-divider"></div>

            <a href="#" class="category-item"><i class="fa-solid fa-bottle-droplet me-1 text-muted"></i> Edible Oil</a>
            <div class="cat-divider"></div>

            <a href="#" class="category-item"><i class="fa-solid fa-jar me-1 text-muted"></i> Honey</a>
            <div class="cat-divider"></div>

            <a href="#" class="category-item"><i class="fa-solid fa-utensils me-1 text-muted"></i> Ready to cook</a>
            <div class="cat-divider"></div>

            <a href="#" class="category-item"><i class="fa-solid fa-heart-pulse me-1 text-muted"></i> Health Care</a>
            <div class="cat-divider"></div>

            <a href="#" class="category-item"><i class="fa-solid fa-bag-shopping me-1 text-muted"></i> Combos</a>
            <div class="cat-divider"></div>

            <a href="#" class="category-item"><i class="fa-solid fa-phone me-1 text-muted"></i> Contact</a>
            <div class="cat-divider"></div>

          </div>

          <!-- Track Order Button -->
          <a href="#" class="btn btn-danger text-white rounded-3 px-3 py-1 fw-semibold ms-3 text-nowrap" style="font-size: 13px;">
            <i class="fa-solid fa-box me-1"></i> Track Order
          </a>

        </div>
      </div>
    </nav>

  </header>

</body>
</html>
