<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Mega Menu Example</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Navbar Styling */
        .navbar {
            background-color: #2c3e50;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            position: relative;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links a:hover {
            color: #3498db;
        }

        /* Mega Menu Container */
        .mega-menu {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            color: #333;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.1);
            padding: 30px;
            display: flex;
            justify-content: space-around;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease-in-out;
        }

        /* Active class to show via JS */
        .mega-menu.show {
            opacity: 1;
            visibility: visible;
        }

        /* Columns inside Mega Menu */
        .menu-col h3 {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 12px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }

        .menu-col a {
            display: block;
            color: #555;
            padding: 6px 0;
            font-size: 14px;
            text-decoration: none;
        }

        .menu-col a:hover {
            color: #3498db;
            padding-left: 5px;
            transition: 0.2s;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">BrandLogo</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            
            <!-- Mega Menu Dropdown -->
            <li class="dropdown">
                <a href="#" class="drop-btn" id="menuBtn">Products ▾</a>
                <div class="mega-menu" id="megaMenu">
                    <div class="menu-col">
                        <h3>Electronics</h3>
                        <a href="#">Smartphones</a>
                        <a href="#">Laptops</a>
                        <a href="#">Headphones</a>
                    </div>
                    <div class="menu-col">
                        <h3>Fashion</h3>
                        <a href="#">Men's Wear</a>
                        <a href="#">Women's Wear</a>
                        <a href="#">Footwear</a>
                    </div>
                    <div class="menu-col">
                        <h3>Home & Kitchen</h3>
                        <a href="#">Appliances</a>
                        <a href="#">Decor</a>
                        <a href="#">Furniture</a>
                    </div>
                </div>
            </li>

            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <script>
        const menuBtn = document.getElementById("menuBtn");
        const megaMenu = document.getElementById("megaMenu");

        // Click karne par mega menu open/close hoga
        menuBtn.addEventListener("click", function(e) {
            e.preventDefault();
            megaMenu.classList.toggle("show");
        });

        // Menu ke bahar kahin bhi click karne par menu close ho jaye
        window.addEventListener("click", function(e) {
            if (!menuBtn.contains(e.target) && !megaMenu.contains(e.target)) {
                megaMenu.classList.remove("show");
            }
        });
    </script>
</body>
</html>
